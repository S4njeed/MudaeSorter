name: Build Standalone Binaries

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            bin_name: MudaePowerTools-Windows-x64.exe
          - label: macOS arm64
            os: macos-latest
            bin_name: MudaePowerTools-macOS-arm64
          - label: Linux x64
            os: ubuntu-latest
            bin_name: MudaePowerTools-Linux-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux Qt6 system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libgl1 libegl1

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy<2.0" PySide6 Pillow opencv-python-headless mss pyautogui \
            imagehash rapidocr-onnxruntime scikit-learn scipy hdbscan \
            faiss-cpu pydantic structlog msgpack pyinstaller

      - name: Run unit & integration tests
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests -v

      - name: Build single-file binary
        run: |
          python build_binary.py

      - name: Smoke-test Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/${{ matrix.bin_name }}" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }

      - name: Smoke-test macOS / Linux binary
        if: runner.os != 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          chmod +x "dist/${{ matrix.bin_name }}"
          "./dist/${{ matrix.bin_name }}" --smoke-test

      - name: Build native OS installer (.msi / .dmg+.pkg / .deb+.tar.gz)
        run: |
          python build_installer.py

      - name: Package macOS .app bundle (if generated)
        if: runner.os == 'macOS'
        run: |
          if [ -d "dist/MudaePowerTools-macOS-arm64.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent "dist/MudaePowerTools-macOS-arm64.app" "dist/MudaePowerTools-macOS-arm64-app.zip"
          fi

      - name: Upload standalone binaries & installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bin_name }}
          path: |
            dist/${{ matrix.bin_name }}
            dist/*.msi
            dist/*.dmg
            dist/*.pkg
            dist/*.deb
            dist/*-installer.tar.gz
            dist/*-app.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
